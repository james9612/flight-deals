name: Collect deals and deploy site

concurrency:
  group: flight-deals-deploy
  cancel-in-progress: true

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install
        working-directory: outputs/flight-deals
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: outputs/flight-deals
      - name: Collect Flytour clearance deals
        run: npm run collect
        working-directory: outputs/flight-deals
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/flight-deals
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
