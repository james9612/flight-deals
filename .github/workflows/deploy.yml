name: Collect deals and deploy site

concurrency:
  group: flight-deals-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 1,7,13,19 * * *' # 台灣時間 09:15, 15:15, 21:15, 03:15 每日四次自動更新
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect all plan deals and airline promos
        run: npm run collect
        working-directory: outputs/flight-deals
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/flight-deals
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
