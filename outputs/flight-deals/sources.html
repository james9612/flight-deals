<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>票源網站清單｜飛行便宜</title>
  <link rel="stylesheet" href="styles/site.css?v=20261025-26">
  <style>
    .source-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 10px 0 45px;
    }
    .source-card {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(15, 30, 23, 0.03);
      transition: transform .2s, box-shadow .2s;
    }
    .source-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(15, 30, 23, 0.07);
    }
    .source-card h2 {
      font-size: 20px;
      font-weight: 800;
      margin: 10px 0 6px;
      color: #0f172a;
    }
    .source-card p {
      font-size: 14.5px;
      color: #334155;
      line-height: 1.7;
      margin: 6px 0;
    }
    .source-card .open-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      background: #f1f5f9;
      color: #0f172a;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 800;
      text-decoration: none;
      align-self: flex-start;
      transition: all .2s;
      border: 1px solid #cbd5e1;
    }
    .source-card .open-btn:hover {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .status-badge {
      font-size: 13px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 5px 12px;
      border-radius: 20px;
      color: #065f46;
      font-weight: 800;
      align-self: flex-start;
    }
    .status-badge.online {
      background: #dcfce7;
      color: #15803d;
    }
    .status-badge.airline {
      background: #ffedd5;
      color: #c2410c;
      border-color: #fed7aa;
    }
    .source-type {
      font-size: 13px;
      color: #64748b;
      font-weight: 700;
      margin-top: 6px;
    }
    .back {
      font-size: 15px;
      color: var(--green);
      text-decoration: none;
      font-weight: 800;
    }
    .notice-banner {
      padding: 16px 20px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      color: #065f46;
      font-size: 14.5px;
      line-height: 1.7;
      margin: 16px 0 24px;
    }
    .notice-banner b {
      color: #047857;
    }
    @media(max-width: 768px) {
      .source-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"><span class="mark">✈</span>飛行便宜</div>
      <a class="back" href="index.html">← 回首頁比價列表</a>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">SOURCE DIRECTORY</div>
        <h1>全台旅行社計畫票 ＆ 廉航 0 元特報<br><em>票源網站清單</em></h1>
        <p class="lead">全天候定時自動採集全台各大旅行社計畫票專區與 5 大廉價航空官方促銷情報，資料透明公開，點擊即可直達官方預訂來源。</p>
      </div>
    </section>

    <div class="notice-banner">
      <b>⚡ 即時資料管線運作中：</b>全站包含 <b>雄獅旅遊、飛遊網、可樂旅遊、易飛網、KKday、東森旅遊、FunTime、飛趣旅遊</b> 以及 <b>越捷航空、亞洲航空、台灣虎航、樂桃航空、酷航</b> 等票源網站，皆已實裝自動化蒐集採集並經比價與去重清洗。
    </div>

    <div class="source-list" id="sources"></div>

    <footer>
      <span>飛行便宜｜票源網站清單</span>
      <span>來源狀態每日定時自動更新</span>
    </footer>
  </div>
  <script src="scripts/sources.js" defer></script>
</body>
</html>
